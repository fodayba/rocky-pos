<div class="min-h-screen bg-white">
  <!-- Top Navigation -->
  <nav class="nav-header">
    <div class="nav-container">
      <div class="nav-content">
        <div class="nav-left">
          <button (click)="toggleSidebar()" class="nav-toggle" aria-label="Toggle sidebar">
            <app-icon name="menu" [size]="22"></app-icon>
          </button>
          <h1 class="nav-title">Rocky POS</h1>
        </div>

        <div class="nav-right">
          @if (hasActiveShift()) {
            <div class="shift-indicator shift-active">
              <div class="shift-dot"></div>
              <span class="shift-text">Active Shift</span>
            </div>
          } @else {
            <div class="shift-indicator shift-inactive">
              <div class="shift-dot"></div>
              <span class="shift-text">No Shift</span>
            </div>
          }

          @if (currentUser(); as user) {
            <div class="user-info-wrapper">
              <div class="user-info">
                <p class="user-name">{{ user.firstName }} {{ user.lastName }}</p>
                <p class="user-role">{{ user.role }}</p>
              </div>
              <button (click)="logout()" class="btn-logout" title="Logout">
                <app-icon name="log-out" [size]="18"></app-icon>
                <span class="btn-logout-text">Logout</span>
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </nav>

  <div class="flex">
    <!-- Sidebar -->
    @if (sidebarOpen()) {
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <ul class="nav-list">
            @for (item of navItems; track item.path) {
              @if (canAccessRoute(item.roles)) {
                <li>
                  <a
                    [routerLink]="item.path"
                    routerLinkActive="nav-active"
                    [routerLinkActiveOptions]="{ exact: false }"
                    class="nav-item"
                  >
                    <app-icon [name]="item.icon" [size]="18"></app-icon>
                    <span>{{ item.label }}</span>
                  </a>
                </li>
              }
            }
          </ul>
        </nav>
      </aside>
    }

    <!-- Main Content -->
    <main class="main-content" [class.sidebar-open]="sidebarOpen()">
      <router-outlet />
    </main>
  </div>
</div>

<div class="max-w-7xl mx-auto p-6 space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-semibold" style="color: var(--color-stone-900);">
        Locations
      </h1>
      <p class="text-sm mt-1" style="color: var(--color-stone-500);">
        Manage store locations and facilities
      </p>
    </div>
    <button class="btn btn-primary" (click)="createLocation()">
      <app-icon name="plus" [size]="20" />
      Add Location
    </button>
  </div>

  <!-- Statistics Cards -->
  @if (statistics()) {
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Total Locations</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-stone-900);">
            {{ statistics()!.totalLocations }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Active Locations</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-green-600);">
            {{ statistics()!.totalActive }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Total Employees</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-blue-600);">
            {{ statistics()!.totalEmployees }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Fuel Locations</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-purple-600);">
            {{ statistics()!.locationsWithFuel }}
          </p>
        </div>
      </div>
    </div>
  }

  <!-- Filters -->
  <div class="card">
    <div class="card-body">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Search</label>
          <input
            type="text"
            placeholder="Search by code, name, city, state..."
            [value]="searchQuery()"
            (input)="updateSearch($any($event.target).value)"
            class="input w-full"
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Status</label>
          <select
            [value]="selectedStatus()"
            (change)="updateStatusFilter($any($event.target).value)"
            class="input w-full"
          >
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="temporarily_closed">Temporarily Closed</option>
            <option value="under_maintenance">Under Maintenance</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <app-data-table
    [data]="filteredLocations()"
    [columns]="columns"
    [actions]="actions"
    [pageSize]="20"
  />
</div>

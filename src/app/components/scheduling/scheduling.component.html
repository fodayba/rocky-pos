<div class="max-w-7xl mx-auto p-6 space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-semibold" style="color: var(--color-stone-900);">
        Scheduling
      </h1>
      <p class="text-sm mt-1" style="color: var(--color-stone-500);">
        Manage employee shifts and schedules
      </p>
    </div>
    <button class="btn btn-primary" (click)="createShift()">
      <app-icon name="plus" [size]="20" />
      Create Shift
    </button>
  </div>

  <!-- Statistics Cards -->
  @if (statistics()) {
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Total Shifts</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-stone-900);">
            {{ statistics()!.totalShifts }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Scheduled</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-blue-600);">
            {{ statistics()!.scheduledShifts }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">In Progress</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-green-600);">
            {{ statistics()!.inProgressShifts }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Employees</p>
          <p class="text-2xl font-bold mt-1" style="color: var(--color-purple-600);">
            {{ statistics()!.totalEmployeesScheduled }}
          </p>
        </div>
      </div>
    </div>
  }

  <!-- Filters -->
  <div class="card">
    <div class="card-body">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Search</label>
          <input
            type="text"
            placeholder="Search by employee, location, position..."
            [value]="searchQuery()"
            (input)="updateSearch($any($event.target).value)"
            class="input w-full"
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Status</label>
          <select
            [value]="selectedStatus()"
            (change)="updateStatusFilter($any($event.target).value)"
            class="input w-full"
          >
            <option value="all">All</option>
            <option value="scheduled">Scheduled</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="no_show">No Show</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <app-data-table
    [data]="filteredShifts()"
    [columns]="columns"
    [actions]="actions"
    [pageSize]="20"
  />
</div>

<div class="signup-container">
  <div class="signup-wrapper">
    <div class="signup-card">
      <div class="signup-header">
        <h1 class="signup-title">Create Account</h1>
        <p class="signup-subtitle">Start your business journey</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="signup-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName" class="form-label">First Name</label>
            <input
              id="firstName"
              type="text"
              [value]="firstName()"
              (input)="firstName.set($any($event.target).value)"
              class="input"
              placeholder="John"
              required
            />
          </div>

          <div class="form-group">
            <label for="lastName" class="form-label">Last Name</label>
            <input
              id="lastName"
              type="text"
              [value]="lastName()"
              (input)="lastName.set($any($event.target).value)"
              class="input"
              placeholder="Doe"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="businessName" class="form-label">Business Name</label>
          <input
            id="businessName"
            type="text"
            [value]="businessName()"
            (input)="businessName.set($any($event.target).value)"
            class="input"
            placeholder="Rocky's Gas & Minimart"
            required
          />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            class="input"
            placeholder="john@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            [value]="confirmPassword()"
            (input)="confirmPassword.set($any($event.target).value)"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>

        @if (error()) {
          <div class="error-message">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="btn btn-primary"
        >
          @if (loading()) {
            <span>Creating account...</span>
          } @else {
            <span>Create Account</span>
          }
        </button>
      </form>

      <div class="signup-footer">
        <p class="login-link-text">
          Already have an account?
          <a routerLink="/login">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>

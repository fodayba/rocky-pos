<div class="min-h-screen flex items-center justify-center px-4" style="background: var(--color-bg-secondary);">
  <div class="w-full max-w-md">
    <div class="card animate-fade-in-up" style="box-shadow: var(--shadow-xl);">
      <div style="padding: var(--space-12);">
        <div class="text-center" style="margin-bottom: var(--space-12);">
          <h1 style="
            font-size: var(--text-3xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
            color: var(--color-text-primary);
            letter-spacing: var(--tracking-tight);
          ">
            Rocky POS
          </h1>
          <p style="font-size: var(--text-sm); color: var(--color-text-tertiary);">Gas Station & Minimart</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="email" style="
              display: block;
              font-size: var(--text-sm);
              font-weight: 600;
              margin-bottom: var(--space-3);
              color: var(--color-text-secondary);
            ">
              Email Address
            </label>
            <input
              id="email"
              type="email"
              [value]="email()"
              (input)="email.set($any($event.target).value)"
              class="input"
              placeholder="you@example.com"
              required
            />
          </div>

          <div>
            <label for="password" style="
              display: block;
              font-size: var(--text-sm);
              font-weight: 600;
              margin-bottom: var(--space-3);
              color: var(--color-text-secondary);
            ">
              Password
            </label>
            <input
              id="password"
              type="password"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              class="input"
              placeholder="••••••••"
              required
            />
          </div>

          @if (error()) {
            <div style="
              padding: var(--space-4);
              border: 1px solid var(--color-error);
              background: var(--color-error-light);
              color: var(--color-error);
              border-radius: var(--radius-lg);
              font-size: var(--text-sm);
            ">
              {{ error() }}
            </div>
          }

          <button
            type="submit"
            [disabled]="loading()"
            class="btn btn-primary"
            style="width: 100%; padding: var(--space-4); margin-top: var(--space-6);"
          >
            @if (loading()) {
              <span>Signing in...</span>
            } @else {
              <span>Sign In</span>
            }
          </button>
        </form>

        <div style="margin-top: var(--space-10);">
          <div class="text-center" style="margin-bottom: var(--space-6);">
            <p style="font-size: var(--text-sm); color: var(--color-text-secondary);">
              New business?
              <a
                routerLink="/signup"
                style="
                  color: var(--color-text-primary);
                  font-weight: 600;
                  margin-left: var(--space-1);
                  transition: opacity var(--transition-base);
                "
                onmouseover="this.style.opacity='0.7'"
                onmouseout="this.style.opacity='1'"
              >
                Create an account
              </a>
            </p>
          </div>

          <button
            type="button"
            (click)="toggleCredentials()"
            class="btn btn-ghost"
            style="
              width: 100%;
              color: var(--color-text-secondary);
              border: 1px solid var(--color-border-primary);
            "
          >
            {{ showCredentials() ? 'Hide' : 'Show' }} Test Credentials
          </button>

          @if (showCredentials()) {
            <div style="
              padding: var(--space-6);
              margin-top: var(--space-4);
              background: var(--color-bg-tertiary);
              border: 1px solid var(--color-border-primary);
              border-radius: var(--radius-xl);
            " class="animate-slide-down">
              <p style="
                font-size: var(--text-sm);
                font-weight: 600;
                margin-bottom: var(--space-5);
                color: var(--color-text-secondary);
                text-transform: uppercase;
                letter-spacing: var(--tracking-wide);
              ">Test Accounts</p>
              <div class="space-y-3">
                @for (cred of mockCredentials; track cred.email) {
                  <div class="interactive-card" style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: var(--space-4);
                    background: var(--color-bg-primary);
                    border: 1px solid var(--color-border-primary);
                    border-radius: var(--radius-lg);
                  ">
                    <div>
                      <span style="
                        font-weight: 600;
                        font-size: var(--text-sm);
                        color: var(--color-text-primary);
                      ">{{ cred.email }}</span>
                      <span style="
                        font-size: var(--text-xs);
                        margin-left: var(--space-2);
                        color: var(--color-text-tertiary);
                        text-transform: capitalize;
                      ">({{ cred.role }})</span>
                    </div>
                    <button
                      type="button"
                      (click)="fillCredentials(cred.email, cred.password)"
                      class="btn btn-secondary"
                      style="padding: var(--space-2) var(--space-4); font-size: var(--text-xs);"
                    >
                      Use
                    </button>
                  </div>
                }
              </div>
              <p style="
                margin-top: var(--space-5);
                font-size: var(--text-xs);
                color: var(--color-text-tertiary);
                font-family: var(--font-mono);
              ">Password for all: password123</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>

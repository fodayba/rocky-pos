<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-purple-600">
  <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Rocky POS</h1>
      <p class="text-gray-600">Gas Station & Minimart</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
          placeholder="Enter email"
          required
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          Password
        </label>
        <input
          id="password"
          type="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
          placeholder="Enter password"
          required
        />
      </div>

      @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-semibold py-3 rounded-lg transition duration-200 transform hover:scale-105"
      >
        @if (loading()) {
          <span>Logging in...</span>
        } @else {
          <span>Login</span>
        }
      </button>
    </form>

    <div class="mt-6 space-y-4">
      <div class="text-center">
        <p class="text-sm text-gray-600">
          New business?
          <a routerLink="/signup" class="text-blue-600 font-medium hover:underline">Create an account</a>
        </p>
      </div>

      <button
        type="button"
        (click)="toggleCredentials()"
        class="w-full text-sm text-gray-600 hover:text-gray-800 underline"
      >
        {{ showCredentials() ? 'Hide' : 'Show' }} Test Credentials
      </button>

      @if (showCredentials()) {
        <div class="mt-4 p-4 bg-gray-50 rounded-lg text-sm space-y-2">
          <p class="font-semibold text-gray-700 mb-2">Test Accounts:</p>
          @for (cred of mockCredentials; track cred.email) {
            <div class="flex justify-between items-center p-2 bg-white rounded border border-gray-200">
              <div>
                <span class="font-medium">{{ cred.email }}</span>
                <span class="text-gray-500 ml-2">({{ cred.role }})</span>
              </div>
              <button
                type="button"
                (click)="fillCredentials(cred.email, cred.password)"
                class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded"
              >
                Use
              </button>
            </div>
          }
          <p class="text-xs text-gray-500 mt-2">Password for all: password123</p>
        </div>
      }
    </div>
  </div>
</div>

<div class="login-container">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Rocky POS</h1>
        <p class="login-subtitle">Gas Station & Minimart</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            id="email"
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            class="input"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            class="input"
            placeholder="••••••••"
            required
          />
        </div>

        @if (error()) {
          <div class="error-message">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          [disabled]="loading()"
          class="btn btn-primary"
        >
          @if (loading()) {
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
          }
        </button>
      </form>

      <div class="login-footer">
        <div class="signup-link">
          <p class="signup-text">
            New business?
            <a routerLink="/signup">Create an account</a>
          </p>
        </div>

        <button
          type="button"
          (click)="toggleCredentials()"
          class="btn btn-ghost"
        >
          {{ showCredentials() ? 'Hide' : 'Show' }} Test Credentials
        </button>

        @if (showCredentials()) {
          <div class="credentials-section">
            <p class="credentials-header">Test Accounts</p>
            <div class="credentials-list">
              @for (cred of mockCredentials; track cred.email) {
                <div class="credential-item">
                  <div class="credential-info">
                    <span class="email">{{ cred.email }}</span>
                    <span class="role">({{ cred.role }})</span>
                  </div>
                  <button
                    type="button"
                    (click)="fillCredentials(cred.email, cred.password)"
                    class="btn btn-secondary credential-use-btn"
                  >
                    Use
                  </button>
                </div>
              }
            </div>
            <p class="credentials-password">Password for all: password123</p>
          </div>
        }
      </div>
    </div>
  </div>
</div>

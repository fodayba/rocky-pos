<div class="min-h-screen flex items-center justify-center" style="background: var(--color-slate-100);">
  <div class="bg-white rounded-2xl p-10 w-full max-w-md border" style="border-color: var(--color-slate-200); box-shadow: var(--shadow-xl);">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-semibold tracking-tight mb-2" style="color: var(--color-slate-900);">Rocky POS</h1>
      <p class="text-sm" style="color: var(--color-slate-500);">Gas Station & Minimart</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium mb-2" style="color: var(--color-slate-700);">
          Username
        </label>
        <input
          id="username"
          type="text"
          [value]="username()"
          (input)="username.set($any($event.target).value)"
          class="w-full px-4 py-3 rounded-lg outline-none transition-all"
          style="border: 1px solid var(--color-slate-300); color: var(--color-slate-900);"
          onfocus="this.style.borderColor='var(--color-teal-500)'; this.style.boxShadow='0 0 0 3px var(--color-teal-100)'"
          onblur="this.style.borderColor='var(--color-slate-300)'; this.style.boxShadow='none'"
          placeholder="Enter username"
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>
        <input
          id="email"
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
          placeholder="Enter email"
          required
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-2" style="color: var(--color-slate-700);">
          Password
        </label>
        <input
          id="password"
          type="password"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="w-full px-4 py-3 rounded-lg outline-none transition-all"
          style="border: 1px solid var(--color-slate-300); color: var(--color-slate-900);"
          onfocus="this.style.borderColor='var(--color-teal-500)'; this.style.boxShadow='0 0 0 3px var(--color-teal-100)'"
          onblur="this.style.borderColor='var(--color-slate-300)'; this.style.boxShadow='none'"
          placeholder="Enter password"
          required
        />
      </div>

      @if (error()) {
        <div class="px-4 py-3 rounded-lg border" style="background: var(--color-error-light); border-color: var(--color-error); color: var(--color-error);">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full font-medium py-3 rounded-lg transition-all disabled:opacity-50"
        style="background: var(--color-slate-900); color: white;"
        onmouseover="if(!this.disabled) this.style.background='var(--color-slate-800)'"
        onmouseout="if(!this.disabled) this.style.background='var(--color-slate-900)'"
      >
        @if (loading()) {
          <span>Logging in...</span>
        } @else {
          <span>Login</span>
        }
      </button>
    </form>

    <div class="mt-8">
    <div class="mt-6 space-y-4">
      <div class="text-center">
        <p class="text-sm text-gray-600">
          New business?
          <a routerLink="/signup" class="text-blue-600 font-medium hover:underline">Create an account</a>
        </p>
      </div>

      <button
        type="button"
        (click)="toggleCredentials()"
        class="w-full text-sm font-medium transition-colors"
        style="color: var(--color-slate-600);"
        onmouseover="this.style.color='var(--color-slate-900)'"
        onmouseout="this.style.color='var(--color-slate-600)'"
      >
        {{ showCredentials() ? 'Hide' : 'Show' }} Test Credentials
      </button>

      @if (showCredentials()) {
        <div class="mt-4 p-4 rounded-lg space-y-2" style="background: var(--color-slate-50); border: 1px solid var(--color-slate-200);">
          <p class="text-sm font-medium mb-3" style="color: var(--color-slate-700);">Test Accounts:</p>
          @for (cred of mockCredentials; track cred.username) {
            <div class="flex justify-between items-center p-3 bg-white rounded-lg border" style="border-color: var(--color-slate-200);">
              <div>
                <span class="font-medium text-sm" style="color: var(--color-slate-900);">{{ cred.username }}</span>
                <span class="text-xs ml-2 capitalize" style="color: var(--color-slate-500);">({{ cred.role }})</span>
              </div>
              <button
                type="button"
                (click)="fillCredentials(cred.username, cred.password)"
                class="text-xs font-medium px-3 py-1.5 rounded-md transition-colors"
                style="background: var(--color-teal-100); color: var(--color-teal-700);"
                onmouseover="this.style.background='var(--color-teal-200)'"
                onmouseout="this.style.background='var(--color-teal-100)'"
        <div class="mt-4 p-4 bg-gray-50 rounded-lg text-sm space-y-2">
          <p class="font-semibold text-gray-700 mb-2">Test Accounts:</p>
          @for (cred of mockCredentials; track cred.email) {
            <div class="flex justify-between items-center p-2 bg-white rounded border border-gray-200">
              <div>
                <span class="font-medium">{{ cred.email }}</span>
                <span class="text-gray-500 ml-2">({{ cred.role }})</span>
              </div>
              <button
                type="button"
                (click)="fillCredentials(cred.email, cred.password)"
                class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded"
              >
                Use
              </button>
            </div>
          }
          <p class="text-xs mt-3" style="color: var(--color-slate-500);">Password for all: password123</p>
        </div>
      }
    </div>
  </div>
</div>

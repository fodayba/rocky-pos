<div class="max-w-7xl mx-auto p-6 space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-semibold" style="color: var(--color-stone-900);">
        Suppliers
      </h1>
      <p class="text-sm mt-1" style="color: var(--color-stone-500);">
        Manage your suppliers and vendors
      </p>
    </div>
    <button class="btn btn-primary" (click)="addSupplier()">
      <app-icon name="plus" [size]="20" />
      Add Supplier
    </button>
  </div>

  <!-- Statistics Cards -->
  @if (statistics()) {
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Total Suppliers</p>
          <p class="text-2xl font-semibold mt-1" style="color: var(--color-stone-900);">
            {{ statistics()!.total }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Active</p>
          <p class="text-2xl font-semibold mt-1" style="color: var(--color-green-600);">
            {{ statistics()!.active }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Preferred</p>
          <p class="text-2xl font-semibold mt-1" style="color: var(--color-yellow-600);">
            {{ statistics()!.preferred }}
          </p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <p class="text-sm" style="color: var(--color-stone-500);">Total Purchases</p>
          <p class="text-2xl font-semibold mt-1" style="color: var(--color-stone-900);">
            ${{ statistics()!.totalPurchases.toLocaleString() }}
          </p>
        </div>
      </div>
    </div>
  }

  <!-- Filters -->
  <div class="card">
    <div class="card-body">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Search</label>
          <input
            type="text"
            placeholder="Search by name, code, contact..."
            [value]="searchQuery()"
            (input)="updateSearch($any($event.target).value)"
            class="input w-full"
          />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Type</label>
          <select
            [value]="selectedType()"
            (change)="updateTypeFilter($any($event.target).value)"
            class="input w-full"
          >
            <option value="all">All Types</option>
            <option value="fuel">Fuel</option>
            <option value="merchandise">Merchandise</option>
            <option value="both">Both</option>
            <option value="service">Service</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1" style="color: var(--color-stone-700);">Status</label>
          <select
            [value]="selectedStatus()"
            (change)="updateStatusFilter($any($event.target).value)"
            class="input w-full"
          >
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="preferred">Preferred</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <app-data-table
    [data]="filteredSuppliers()"
    [columns]="columns"
    [actions]="actions"
    [pageSize]="20"
  />
</div>
